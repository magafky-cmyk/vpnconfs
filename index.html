<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XenoProjects 2026</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: radial-gradient(circle at top, #1e1b4b 0%, #0f172a 60%, #020617 100%);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        .container {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 24px 20px;
            max-width: 360px;
            width: 100%;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        .logo-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            border-radius: 14px;
            font-size: 24px;
            margin-bottom: 12px;
        }
        h1 {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }
        p.subtitle {
            color: #94a3b8;
            font-size: 13px;
            line-height: 1.4;
            margin-bottom: 16px;
        }
        .info-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-around;
        }
        .info-item .val {
            font-size: 13px;
            font-weight: 700;
            color: #38bdf8;
        }
        .info-item .lbl {
            font-size: 10px;
            color: #64748b;
            text-transform: uppercase;
            margin-top: 2px;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: transform 0.1s ease;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn-primary {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: #ffffff;
        }
        .btn-secondary {
            background: rgba(51, 65, 85, 0.5);
            color: #cbd5e1;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .footer-text {
            margin-top: 16px;
            font-size: 11px;
            color: #475569;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-badge">🚀</div>
        <h1>XenoProjects 2026</h1>
        <p class="subtitle">Приватная экосистема и VPN-подписка</p>

        <div class="info-card">
            <div class="info-item">
                <div class="val">XenoVPN</div>
                <div class="lbl">Сервис</div>
            </div>
            <div class="info-item">
                <div class="val">2026</div>
                <div class="lbl">Релиз</div>
            </div>
            <div class="info-item">
                <div class="val">Active</div>
                <div class="lbl">Статус</div>
            </div>
        </div>

        <div class="btn-group">
            <a id="subLink" class="btn btn-primary" href="#">
                ⚡ Подключить VPN
            </a>

            <button class="btn btn-secondary" onclick="copyLink()">
                📋 Скопировать ссылку
            </button>
        </div>

        <div class="footer-text">
            © 2026 XenoProjects
        </div>
    </div>

    <script>
        const rawSub = "https://raw.githubusercontent.com/magafky-cmyk/vpnconfs/refs/heads/main/configs.txt";
        
        document.getElementById("subLink").href = "happ://import/" + rawSub + "#XenoVPN_2026";

        function copyLink() {
            navigator.clipboard.writeText(rawSub);
            alert("Ссылка скопирована!");
        }
    </script>

</body>
</html>
