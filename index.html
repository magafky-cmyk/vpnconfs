<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XenoVPN — Подключение</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: #1e293b;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        h1 { font-size: 28px; margin-bottom: 10px; color: #38bdf8; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 25px; }
        .btn {
            display: block;
            width: 100%;
            padding: 14px 0;
            margin: 10px 0;
            border-radius: 12px;
            font-weight: bold;
            text-decoration: none;
            transition: 0.2s;
            box-sizing: border-box;
        }
        .btn-primary { background: #0ea5e9; color: #fff; }
        .btn-primary:hover { background: #0284c7; }
        .btn-secondary { background: #334155; color: #38bdf8; border: 1px solid #0ea5e9; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🛡️ XenoVPN</h1>
        <p>Быстрый и защищенный доступ к сети</p>

        <!-- Кнопка автоматического импорта в Happ / Streisand -->
        <a id="subLink" class="btn btn-primary" href="#">Добавить подписку XenoVPN</a>

        <!-- Кнопка скопировать ссылку -->
        <button class="btn btn-secondary" onclick="copyLink()">Скопировать ссылку</button>
    </div>

    <script>
        const rawSub = "https://raw.githubusercontent.com/magafky-cmyk/vpnconfs/refs/heads/main/configs.txt";
        
        // Формирование прямой ссылки для импорта в приложения
        document.getElementById("subLink").href = "happ://import/" + rawSub + "#XenoVPN";

        function copyLink() {
            navigator.clipboard.writeText(rawSub);
            alert("Ссылка на подписку XenoVPN скопирована!");
        }
    </script>
</body>
</html>
