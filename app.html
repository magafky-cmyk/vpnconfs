<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XENO VPN</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #17212b;
            --text-color: #ffffff;
            --hint-color: #708499;
            --button-color: #5288c1;
            --button-text: #ffffff;
            --secondary-bg: #232e3c;
            --section-bg: #1c242e;
            --accent-text: #6ab2f2;
            --destructive: #ec3942;
            --success: #4cd964;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            padding-bottom: 80px;
            transition: background-color 0.3s, color 0.3s;
        }
        .header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid var(--secondary-bg);
        }
        .header h1 {
            font-size: 22px;
            font-weight: 700;
            color: var(--accent-text);
        }
        .header p {
            font-size: 14px;
            color: var(--hint-color);
            margin-top: 4px;
        }
        .content {
            padding: 16px;
        }
        .card {
            background-color: var(--section-bg);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }
        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .card-subtitle {
            font-size: 14px;
            color: var(--hint-color);
        }
        .status-active {
            color: var(--success);
            font-weight: 600;
        }
        .status-expired {
            color: var(--destructive);
            font-weight: 600;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background-color: var(--button-color);
            color: var(--button-text);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
            transition: opacity 0.2s;
        }
        .btn:active { opacity: 0.7; }
        .btn-admin { background-color: #8e44ad; }
        .btn-secondary {
            background-color: var(--secondary-bg);
            color: var(--text-color);
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--section-bg);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            padding-bottom: calc(12px + env(safe-area-inset-bottom));
            border-top: 1px solid var(--secondary-bg);
            z-index: 100;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 4px 16px;
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.2s;
        }
        .nav-item.active { opacity: 1; color: var(--accent-text); }
        .nav-item span { font-size: 11px; }
        .nav-icon { font-size: 20px; }
        .hidden { display: none !important; }
        .auth-error {
            color: var(--destructive);
            text-align: center;
            padding: 40px 20px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div id="auth-screen" class="hidden">
        <div class="auth-error">
            ❌ Открой это приложение через бота в Telegram
        </div>
    </div>

    <div id="app" class="hidden">
        <div class="header">
            <h1>💎 XENO VPN</h1>
            <p>Быстрый, стабильный, удобный</p>
        </div>

        <div class="content">
            <div id="page-main">
                <div class="card">
                    <div class="card-title">👋 Добро пожаловать, <span id="user-name">гость</span>!</div>
                    <div class="card-subtitle">Выбери раздел в меню ниже</div>
                </div>
            </div>

            <div id="page-subscriptions" class="hidden">
                <div class="card">
                    <div class="card-title">💎 Моя подписка</div>
                    <div class="card-subtitle" id="sub-status">Загрузка...</div>
                </div>
                <button class="btn" onclick="closeApp()">⭐ Купить подписку</button>
            </div>

            <div id="page-status" class="hidden">
                <div class="card">
                    <div class="card-title">📊 Статус подписки</div>
                    <div class="card-subtitle" id="status-text">Загрузка...</div>
                </div>
            </div>

            <div id="page-admin" class="hidden">
                <div class="card">
                    <div class="card-title">🎛 Панель управления</div>
                    <div class="card-subtitle">Доступно только администратору</div>
                </div>
                <button class="btn btn-admin" onclick="closeApp()">Открыть панель в боте</button>
            </div>
        </div>

        <div class="bottom-nav">
            <div class="nav-item active" onclick="switchPage('main', this)">
                <span class="nav-icon">🏠</span>
                <span>Главная</span>
            </div>
            <div class="nav-item" onclick="switchPage('subscriptions', this)">
                <span class="nav-icon">💎</span>
                <span>Подписки</span>
            </div>
            <div class="nav-item" onclick="switchPage('status', this)">
                <span class="nav-icon">📊</span>
                <span>Статус</span>
            </div>
            <div class="nav-item hidden" id="admin-nav" onclick="switchPage('admin', this)">
                <span class="nav-icon">🎛</span>
                <span>Панель</span>
            </div>
        </div>
    </div>

<script>
    const tg = window.Telegram?.WebApp;
    console.log("TG объект:", tg);

    if (!tg) {
        document.body.innerHTML = '<p style="color:white;padding:40px;text-align:center;">❌ Telegram SDK не загрузился. Открой через бота.</p>';
    } else {
        tg.ready();
        tg.expand();

        const user = tg.initDataUnsafe?.user;
        console.log("User:", user);

        if (!user) {
            document.body.innerHTML = '<p style="color:white;padding:40px;text-align:center;">❌ Открой приложение через Telegram-бота.</p>';
        } else {
            document.getElementById('app').classList.remove('hidden');
            document.getElementById('auth-screen').classList.add('hidden');
        }
    }
</script>
</body>
</html>
